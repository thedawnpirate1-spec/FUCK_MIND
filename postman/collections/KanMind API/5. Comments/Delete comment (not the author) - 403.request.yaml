$kind: http-request
name: Delete comment (not the author) -> 403
url: "{{base_url}}/api/tasks/{{task_id}}/comments/{{comment_id}}/"
method: DELETE
auth:
  type: apikey
  credentials:
    key: Authorization
    value: "{{auth_secret_068f}}"
    in: header
scripts:
  - type: afterResponse
    code: pm.test('Status code is 403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 7000
