$kind: http-request
name: Create comment - empty content -> 400
url: "{{base_url}}/api/tasks/{{task_id}}/comments/"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "content": ""
    }
auth:
  type: apikey
  credentials:
    key: Authorization
    value: "{{auth_secret_08pz}}"
    in: header
scripts:
  - type: afterResponse
    code: pm.test('Status code is 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 2000
