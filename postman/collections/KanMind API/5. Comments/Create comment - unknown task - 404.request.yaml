$kind: http-request
name: Create comment - unknown task -> 404
url: "{{base_url}}/api/tasks/999999/comments/"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "content": "x"
    }
auth:
  type: apikey
  credentials:
    key: Authorization
    value: "{{auth_secret_08pz}}"
    in: header
scripts:
  - type: afterResponse
    code: pm.test('Status code is 404', () => pm.response.to.have.status(404));
    language: text/javascript
order: 4000
