$kind: http-request
name: Get comments (not a board member) -> 403
url: "{{base_url}}/api/tasks/{{task_id}}/comments/"
method: GET
auth:
  type: apikey
  credentials:
    key: Authorization
    value: "{{auth_secret_0uyf}}"
    in: header
scripts:
  - type: afterResponse
    code: pm.test('Status code is 403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 6000
