$kind: http-request
name: Email check - malformed email -> 400
url: "{{base_url}}/api/email-check/?email=not-an-email"
method: GET
queryParams:
  email: not-an-email
auth:
  type: apikey
  credentials:
    key: Authorization
    value: "{{auth_secret_068f}}"
    in: header
scripts:
  - type: afterResponse
    code: pm.test('Status code is 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 3000
