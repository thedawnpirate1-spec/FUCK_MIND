$kind: http-request
name: Email check - without token -> 401
url: "{{base_url}}/api/email-check/?email={{email_b}}"
method: GET
queryParams:
  email: "{{email_b}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status code is 401', () => pm.response.to.have.status(401));
    language: text/javascript
order: 4000
