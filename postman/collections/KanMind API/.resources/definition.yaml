$kind: collection
description: |-
  Tests for all endpoints of the KanMind endpoint documentation.

  Run the folders in order (Collection Runner): the requests register three users (A = owner, B = member, C = outsider) and pass tokens and ids via collection variables. Start the backend with `python manage.py runserver` first.
variables:
  - key: base_url
    value: http://127.0.0.1:8000
    disabled: false
    secret: false
  - key: token_a
    value: ""
    disabled: false
    secret: false
  - key: token_b
    value: ""
    disabled: false
    secret: false
  - key: token_c
    value: ""
    disabled: false
    secret: false
  - key: user_a_id
    value: ""
    disabled: false
    secret: false
  - key: user_b_id
    value: ""
    disabled: false
    secret: false
  - key: user_c_id
    value: ""
    disabled: false
    secret: false
  - key: email_a
    value: ""
    disabled: false
    secret: false
  - key: email_b
    value: ""
    disabled: false
    secret: false
  - key: email_c
    value: ""
    disabled: false
    secret: false
  - key: board_id
    value: ""
    disabled: false
    secret: false
  - key: task_id
    value: ""
    disabled: false
    secret: false
  - key: comment_id
    value: ""
    disabled: false
    secret: false
  - key: auth_secret_068f
    secret: true
    disabled: false
  - key: auth_secret_08pz
    secret: true
    disabled: false
  - key: auth_secret_0uyf
    secret: true
    disabled: false
auth:
  - id: ec958d4b-81cc-4375-8794-b2e4ff9e72fa
    type: apikey
    name: apikey auth
    credentials:
      key: Authorization
      value: "{{auth_secret_068f}}"
      in: header
