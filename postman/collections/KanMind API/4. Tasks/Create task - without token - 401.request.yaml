$kind: http-request
name: Create task - without token -> 401
url: "{{base_url}}/api/tasks/"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "board": {{board_id}},
      "title": "x"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status code is 401', () => pm.response.to.have.status(401));
    language: text/javascript
order: 6000
