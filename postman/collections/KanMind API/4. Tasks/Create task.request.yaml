$kind: http-request
url: "{{base_url}}/api/tasks/"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "board": {{board_id}},
      "title": "Code-Review durchführen",
      "description": "Den neuen PR für das Feature X überprüfen",
      "status": "to-do",
      "priority": "high",
      "assignee_id": {{user_b_id}},
      "reviewer_id": {{user_a_id}},
      "due_date": "2027-02-27"
    }
auth:
  type: apikey
  credentials:
    key: Authorization
    value: "{{auth_secret_08pz}}"
    in: header
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 201', () => pm.response.to.have.status(201));
      const json = pm.response.json();
      pm.test('Response has exactly the documented fields', () => pm.expect(Object.keys(json).sort()).to.have.members(['id', 'title', 'description', 'status', 'priority', 'assignee', 'reviewer', 'due_date', 'comments_count', 'board'].sort()));
      pm.collectionVariables.set('task_id', json.id);
      pm.test('assignee and reviewer are user objects', () => { pm.expect(Object.keys(json.assignee).sort()).to.have.members(['id', 'email', 'fullname'].sort()); pm.expect(json.assignee.id).to.eql(Number(pm.collectionVariables.get('user_b_id'))); pm.expect(json.reviewer.id).to.eql(Number(pm.collectionVariables.get('user_a_id'))); pm.expect(json.comments_count).to.eql(0); });
    language: text/javascript
order: 1000
