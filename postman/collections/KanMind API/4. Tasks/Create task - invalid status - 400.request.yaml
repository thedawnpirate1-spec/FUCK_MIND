$kind: http-request
name: Create task - invalid status -> 400
url: "{{base_url}}/api/tasks/"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "board": {{board_id}},
      "title": "x",
      "status": "in_progress",
      "priority": "low"
    }
auth:
  type: apikey
  credentials:
    key: Authorization
    value: "{{auth_secret_08pz}}"
    in: header
scripts:
  - type: afterResponse
    code: pm.test('Status code is 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 2000
