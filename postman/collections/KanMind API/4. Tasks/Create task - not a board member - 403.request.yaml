$kind: http-request
name: Create task - not a board member -> 403
url: "{{base_url}}/api/tasks/"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "board": {{board_id}},
      "title": "x",
      "status": "to-do",
      "priority": "low"
    }
auth:
  type: apikey
  credentials:
    key: Authorization
    value: "{{auth_secret_0uyf}}"
    in: header
scripts:
  - type: afterResponse
    code: pm.test('Status code is 403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 5000
