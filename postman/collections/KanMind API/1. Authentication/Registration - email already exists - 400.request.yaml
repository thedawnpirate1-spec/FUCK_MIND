$kind: http-request
name: Registration - email already exists -> 400
url: "{{base_url}}/api/registration/"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fullname": "Duplicate",
      "email": "{{email_a}}",
      "password": "SafePassword123!",
      "repeated_password": "SafePassword123!"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status code is 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 5000
