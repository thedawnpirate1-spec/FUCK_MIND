$kind: http-request
name: Login - wrong password -> 400
url: "{{base_url}}/api/login/"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email_a}}",
      "password": "wrong-password"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status code is 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 7000
