$kind: http-request
name: Create board - without token -> 401
url: "{{base_url}}/api/boards/"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "No Auth",
      "members": []
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status code is 401', () => pm.response.to.have.status(401));
    language: text/javascript
order: 3000
