$kind: http-request
name: Update board (not a member) -> 403
url: "{{base_url}}/api/boards/{{board_id}}/"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Hacked"
    }
auth:
  type: apikey
  credentials:
    key: Authorization
    value: "{{auth_secret_0uyf}}"
    in: header
scripts:
  - type: afterResponse
    code: pm.test('Status code is 403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 9000
