$kind: http-request
name: Get board detail - unknown id -> 404
url: "{{base_url}}/api/boards/999999/"
method: GET
auth:
  type: apikey
  credentials:
    key: Authorization
    value: "{{auth_secret_068f}}"
    in: header
scripts:
  - type: afterResponse
    code: pm.test('Status code is 404', () => pm.response.to.have.status(404));
    language: text/javascript
order: 7000
