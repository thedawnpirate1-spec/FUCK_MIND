$kind: http-request
name: Delete task (not creator / not owner) -> 403
url: "{{base_url}}/api/tasks/{{task_id}}/"
method: DELETE
auth:
  type: apikey
  credentials:
    key: Authorization
    value: "{{auth_secret_0uyf}}"
    in: header
scripts:
  - type: afterResponse
    code: pm.test('Status code is 403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 1000
