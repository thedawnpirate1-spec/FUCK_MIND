$kind: http-request
url: "{{base_url}}/api/tasks/{{task_id}}/"
method: DELETE
auth:
  type: apikey
  credentials:
    key: Authorization
    value: "{{auth_secret_068f}}"
    in: header
scripts:
  - type: afterResponse
    code: pm.test('Status code is 204', () => pm.response.to.have.status(204));
    language: text/javascript
order: 2000
